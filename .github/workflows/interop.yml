name: SDK interoperability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fastmcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fastmcp: ['3.4.11', '4.1.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned SDK
        run: python -m pip install "fastmcp==${{ matrix.fastmcp }}"
      - name: Build scanner and start local server
        run: |
          go build -o mcpenum ./cmd/mcpenum
          python tests/interop/fastmcp_server.py > /tmp/fastmcp.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:14004/api/v1/mcp; then exit 0; fi
            sleep 1
          done
          cat /tmp/fastmcp.log
          exit 1
      - name: Discover custom path and inventory tool
        run: |
          ./mcpenum --target 127.0.0.1:14004 --path /api/v1/mcp --format json --quiet --rate 0 > result.json
          python - <<'PY'
          import json
          results = json.load(open('result.json'))
          assert len(results) == 1
          service = results[0]['services'][0]
          assert service['detection']['status'] == 'confirmed'
          assert any(tool['name'] == 'heartbeat' for tool in service['mcp']['inventories']['anonymous']['tools']['items'])
          PY
